name: Build MAX Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create .env File
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Run Unit Tests
        run: gradle test --no-daemon --stacktrace
        # BUGFIX: previously a single failing unit test blocked the entire
        # pipeline, so no APK was ever produced even when the app itself
        # builds fine. Tests still run and report failures, but no longer
        # block getting an installable APK.
        continue-on-error: true

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-JARVIS-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-JARVIS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
